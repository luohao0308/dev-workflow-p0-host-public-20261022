name: Host doctor Windows targeted validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  doctor-and-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Doctor module after explicit raw Git fixture configuration
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest tests.test_deployment_host_doctor
      - name: Native PowerShell integration
        shell: pwsh
        run: ./tests/integration.ps1
