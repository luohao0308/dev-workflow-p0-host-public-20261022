name: P15 Windows gateway replacement checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-gateway:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Native Windows gateway contracts
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest tests.test_deployment_gateway -v
