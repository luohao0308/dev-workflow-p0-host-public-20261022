name: v0.13.1 reviewed upgrade Windows validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewed-upgrade-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Exact reviewed-upgrade Python regressions on Windows
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest tests.test_reviewed_windows_probe -v
      - name: Native PowerShell install and audit regressions
        shell: pwsh
        run: ./tests/integration.ps1
